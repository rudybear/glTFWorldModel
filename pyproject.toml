[project]
name = "gltfworld"
version = "0.1.0"
description = "World-model proof of concept using glTF 2.0 as the training/inference transport"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "rudybear" }]
dependencies = ["numpy>=1.26", "pygltflib>=1.16.5", "trimesh>=4.0"]

[project.optional-dependencies]
sim = ["mujoco>=3.1"]
ml = ["torch>=2.3", "safetensors>=0.4", "scipy>=1.11", "imageio[ffmpeg]>=2.34"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "jsonschema>=4"]

[project.scripts]
gltfworld = "gltfworld.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gltfworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "gltfworld"
version = "0.1.0"
description = "World-model proof of concept using glTF 2.0 as the training/inference transport"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "rudybear" }]
dependencies = ["numpy>=1.26", "pygltflib>=1.16.5", "trimesh>=4.0"]

[project.optional-dependencies]
sim = ["mujoco>=3.1", "h5py>=3.10"]
ml = ["torch>=2.3", "safetensors>=0.4", "scipy>=1.11", "imageio[ffmpeg]>=2.34", "matplotlib>=3.8"]
# Runtime deps of the vendored pyrender (src/gltfworld/_vendor/pyrender, see
# PROVENANCE.md): exactly what the vendored code imports on the paths
# gltfworld exercises. Deliberately excludes pyglet (guarded out; only the
# interactive Viewer needs it) and scipy (not imported by pyrender itself).
render = ["PyOpenGL>=3.1", "Pillow>=10", "freetype-py>=2.3", "networkx>=3.0", "six>=1.16"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "jsonschema>=4", "scikit-image>=0.22", "torchmetrics>=1.3"]

[project.scripts]
gltfworld = "gltfworld.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gltfworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a GPU + working EGL offscreen context (skipped in CI, run locally: `uv run pytest -v`; excluded with `-m \"not gpu\"`)",
]

name: CI

on:
  push:
  pull_request:

env:
  GLTF_VALIDATOR_VERSION: "2.0.0-dev.3.10"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --dev

      # tests/test_validator.py exercises gltfworld's own download/cache
      # logic (gltfworld.cli.ensure_validator_binary), which caches to
      # ~/.cache/gltfworld/ independently of the gltf-validator job below.
      - name: Cache gltfworld's glTF-Validator binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltfworld
          key: gltfworld-gltf-validator-${{ env.GLTF_VALIDATOR_VERSION }}-linux64

      - name: Run tests
        run: uv run pytest -v

  gltf-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Cache glTF-Validator binary
        id: cache-validator
        uses: actions/cache@v4
        with:
          path: gltf-validator
          key: gltf-validator-${{ env.GLTF_VALIDATOR_VERSION }}-linux64

      - name: Download pinned glTF-Validator release
        if: steps.cache-validator.outputs.cache-hit != 'true'
        run: |
          mkdir -p gltf-validator
          curl -sSL \
            "https://github.com/KhronosGroup/glTF-Validator/releases/download/${GLTF_VALIDATOR_VERSION}/gltf_validator-${GLTF_VALIDATOR_VERSION}-linux64.tar.xz" \
            -o /tmp/gltf_validator.tar.xz
          tar -xJf /tmp/gltf_validator.tar.xz -C gltf-validator

      # This job only checks that the pinned binary runs. Real GLB/glTF
      # validation against generated fixtures happens in the `test` job
      # (tests/test_validator.py), via gltfworld's own
      # download/cache path (gltfworld.cli.ensure_validator_binary),
      # which is intentionally independent of this job's cache.
      - name: Check glTF-Validator version
        run: ./gltf-validator/gltf_validator --version

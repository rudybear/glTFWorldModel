name: CI

on:
  push:
  pull_request:

env:
  GLTF_VALIDATOR_VERSION: "2.0.0-dev.3.10"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system EGL runtime library
        # `import mujoco` (as of mujoco 3.11, unpinned upper bound) now
        # unconditionally imports mujoco.rendering.classic.renderer ->
        # mujoco.egl -> `OpenGL.EGL`, whose raw ctypes bindings
        # (OpenGL.raw.EGL._types) load libEGL.so.1 at *module import time*,
        # not lazily. mujoco's own `try/except ImportError` guard around
        # that import (see mujoco/__init__.py) does NOT catch this, because
        # when libEGL.so.1 is entirely absent from the system (true of
        # plain `ubuntu-latest` runners, which have no GL/EGL packages
        # preinstalled), PyOpenGL's ctypes loader resolves the symbol
        # table to `None` and then raises `AttributeError` (not
        # `ImportError`) trying to read an attribute off it -- silently
        # breaking the documented "MuJoCo's core physics API needs no
        # GPU/EGL context" assumption (DESIGN.md/V3) for every module that
        # does a bare `import mujoco` (gltfworld.datagen.*), even though no
        # test here ever creates an EGL context. Installing a real
        # (software) libEGL is enough to satisfy the ctypes symbol lookup;
        # no GPU is needed since nothing here actually renders through it.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        # --extra render: gpu-marked render tests (deselected below) still
        # get *collected* (their modules import gltfworld.render.renderer /
        # .crosscheck at module scope), so PyOpenGL & friends must resolve
        # even though no GPU/EGL context is ever created in CI.
        # --extra sim: MuJoCo's core physics API (gltfworld.datagen.*) needs
        # no GPU/EGL context at all -- only mujoco.Renderer (used by
        # gltfworld.render.crosscheck, gpu-marked) does. So the V3 datagen
        # tests (test_freefall.py, test_velocity_consistency.py,
        # test_episode_pipeline.py) run for real in CI, not just via
        # importorskip.
        run: uv sync --dev --extra render --extra sim --extra ml

      # Real glTF validation (tests/test_validator.py) runs inside the
      # pytest suite below, using the pinned Khronos glTF-Validator binary.
      # tests/test_validator.py exercises gltfworld's own download/cache
      # logic (gltfworld.cli.ensure_validator_binary), which caches to
      # ~/.cache/gltfworld/ independently.
      - name: Cache gltfworld's glTF-Validator binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltfworld
          key: gltfworld-gltf-validator-${{ env.GLTF_VALIDATOR_VERSION }}-linux64

      - name: Run tests
        # gpu-marked tests (milestone V2 renderer: analytic/determinism/
        # crosscheck/benchmark) need a real GPU + working EGL offscreen
        # context, which CI runners don't have; they're run locally only
        # (see docs/VERIFICATION.md V2 section).
        run: uv run pytest -v -m "not gpu"
